<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Test</title>
  <script type="module">
    // 导入 Pretext 库
    import * as pretext from './node_modules/@chenglou/pretext/dist/pretext.js';
    // 将 Pretext 暴露到全局作用域
    window.pretext = pretext;
  </script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .test-section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    h2 { margin-top: 0; }
    .result { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 4px; }
    .button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .button:hover { background: #0069d9; }
  </style>
</head>
<body>
  <h1>Performance Test</h1>
  
  <div class="test-section">
    <h2>Test 1: Pretext Performance</h2>
    <p>Measures the time it takes to prepare and layout multiple text strings.</p>
    <button class="button" onclick="runPretextTest()">Run Pretext Test</button>
    <div id="pretextResult" class="result"></div>
  </div>
  
  <div class="test-section">
    <h2>Test 2: DOM Measurement Performance</h2>
    <p>Measures the time it takes to measure text using DOM methods.</p>
    <button class="button" onclick="runDomTest()">Run DOM Test</button>
    <div id="domResult" class="result"></div>
  </div>
  
  <div class="test-section">
    <h2>Test 3: Comparison</h2>
    <p>Compares Pretext vs DOM measurement performance.</p>
    <button class="button" onclick="runComparisonTest()">Run Comparison Test</button>
    <div id="comparisonResult" class="result"></div>
  </div>
  
  <script>
    // 测试文本数据
    const testTexts = [
      "Hello, world! This is a test of Pretext library.",
      "This is a longer text that should wrap to multiple lines. It demonstrates Pretext's ability to handle line breaks and calculate the correct height.",
      "你好，世界！这是一个测试，展示 Pretext 如何处理中文文本。",
      "This is an extremely long text that will definitely wrap to multiple lines. It's designed to test how Pretext handles longer content with multiple line breaks.",
      "Short text.",
      "Another medium-length text that should wrap once or twice depending on the container width.",
      "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.",
      "Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
      "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.",
      "Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."
    ];
    
    const font = "16px Arial";
    const maxWidth = 400;
    const lineHeight = 24;
    const iterations = 1000;
    
    function runPretextTest() {
      const startTime = performance.now();
      
      for (let i = 0; i < iterations; i++) {
        for (const text of testTexts) {
          const prepared = window.pretext.prepare(text, font);
          window.pretext.layout(prepared, maxWidth, lineHeight);
        }
      }
      
      const endTime = performance.now();
      const duration = endTime - startTime;
      
      document.getElementById('pretextResult').innerHTML = `
        <strong>Result:</strong><br>
        Iterations: ${iterations}<br>
        Texts per iteration: ${testTexts.length}<br>
        Total texts: ${iterations * testTexts.length}<br>
        Duration: ${duration.toFixed(2)}ms<br>
        Average per text: ${(duration / (iterations * testTexts.length)).toFixed(4)}ms
      `;
    }
    
    function runDomTest() {
      // 创建一个隐藏的 DOM 元素用于测量
      const div = document.createElement('div');
      div.style.position = 'absolute';
      div.style.left = '-9999px';
      div.style.top = '-9999px';
      div.style.width = `${maxWidth}px`;
      div.style.font = font;
      div.style.lineHeight = `${lineHeight}px`;
      div.style.whiteSpace = 'normal';
      div.style.wordWrap = 'break-word';
      document.body.appendChild(div);
      
      const startTime = performance.now();
      
      for (let i = 0; i < iterations; i++) {
        for (const text of testTexts) {
          div.textContent = text;
          const height = div.offsetHeight;
        }
      }
      
      const endTime = performance.now();
      const duration = endTime - startTime;
      
      // 清理
      document.body.removeChild(div);
      
      document.getElementById('domResult').innerHTML = `
        <strong>Result:</strong><br>
        Iterations: ${iterations}<br>
        Texts per iteration: ${testTexts.length}<br>
        Total texts: ${iterations * testTexts.length}<br>
        Duration: ${duration.toFixed(2)}ms<br>
        Average per text: ${(duration / (iterations * testTexts.length)).toFixed(4)}ms
      `;
    }
    
    function runComparisonTest() {
      // 运行 Pretext 测试
      const pretextStart = performance.now();
      for (let i = 0; i < iterations; i++) {
        for (const text of testTexts) {
          const prepared = window.pretext.prepare(text, font);
          window.pretext.layout(prepared, maxWidth, lineHeight);
        }
      }
      const pretextEnd = performance.now();
      const pretextDuration = pretextEnd - pretextStart;
      
      // 运行 DOM 测试
      const div = document.createElement('div');
      div.style.position = 'absolute';
      div.style.left = '-9999px';
      div.style.top = '-9999px';
      div.style.width = `${maxWidth}px`;
      div.style.font = font;
      div.style.lineHeight = `${lineHeight}px`;
      div.style.whiteSpace = 'normal';
      div.style.wordWrap = 'break-word';
      document.body.appendChild(div);
      
      const domStart = performance.now();
      for (let i = 0; i < iterations; i++) {
        for (const text of testTexts) {
          div.textContent = text;
          const height = div.offsetHeight;
        }
      }
      const domEnd = performance.now();
      const domDuration = domEnd - domStart;
      
      // 清理
      document.body.removeChild(div);
      
      const speedup = domDuration / pretextDuration;
      
      document.getElementById('comparisonResult').innerHTML = `
        <strong>Comparison Result:</strong><br>
        Pretext duration: ${pretextDuration.toFixed(2)}ms<br>
        DOM duration: ${domDuration.toFixed(2)}ms<br>
        Speedup: ${speedup.toFixed(2)}x faster<br>
        Pretext is ${((1 - pretextDuration / domDuration) * 100).toFixed(2)}% faster than DOM measurement
      `;
    }
  </script>
</body>
</html>
