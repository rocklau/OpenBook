<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenBook - Your Personal RSS Reader & Knowledge Collector</title>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #f7f3ed;
      --bg-secondary: #faf8f5;
      --bg-sidebar: #faf8f5;
      --bg-header: #2c2419;
      --text-primary: #2c2419;
      --text-secondary: #5c4d3c;
      --text-muted: #8b7d6b;
      --accent-color: #8b6914;
      --accent-hover: #6b5110;
      --border-color: #e8e2d9;
      --shadow: 0 1px 3px rgba(44, 36, 25, 0.06);
      --item-hover: #f2ede6;
      --item-active: #ebe5dc;
      --font-family: 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', serif;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      display: grid;
      grid-template-columns: 240px 340px minmax(0, 1fr);
      min-height: 100vh;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .nav-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      background: var(--bg-primary);
      padding: 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .nav-toggle-btn {
      flex: 1;
      padding: 0.4rem;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: var(--font-family);
      color: var(--text-muted);
      transition: all 0.2s;
      font-weight: 500;
    }

    .nav-toggle-btn.active {
      background: var(--bg-secondary);
      color: var(--accent-color);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .feed-search {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: var(--font-family);
    }

    .feed-list {
      list-style: none;
      flex: 1;
      padding: 0.75rem;
      overflow-y: auto;
    }

    .feed-item {
      padding: 0.6rem 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-radius: 4px;
    }

    .feed-item:hover { color: var(--accent-color); background: var(--item-hover); }
    .feed-item.active { color: var(--accent-color); font-weight: 500; background: var(--item-active); }
    .feed-item .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-item .count { font-size: 0.7rem; color: var(--text-muted); }

    .sidebar-footer {
      padding: 1rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Article List Col */
    .article-list-col {
      background: var(--bg-primary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .article-list-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .date-nav-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
    }

    .current-date { font-size: 0.85rem; font-weight: 500; }
    .subtitle { font-size: 0.75rem; color: var(--text-muted); }

    .article-list { list-style: none; overflow-y: auto; flex: 1; }
    .article-item {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
    }
    .article-item:hover { background: var(--item-hover); }
    .article-item.active { background: var(--item-active); }
    .article-item.is-read .article-item-title { color: var(--text-muted); font-weight: 400; }
    .article-item-title { font-size: 0.9rem; line-height: 1.5; margin-bottom: 0.4rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .article-item-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); }

    /* Content Col */
    .content-col {
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    .actionbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 243, 237, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
    }

    .actionbar-inner { display: flex; justify-content: space-between; align-items: center; }
    .actionbar-left, .actionbar-right { display: flex; gap: 8px; align-items: center; }

    .action-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: var(--font-family);
    }
    .action-btn:hover { border-color: var(--accent-color); }

    .content-body { padding: 3rem 2rem; }
    .content-body-inner { max-width: 720px; margin: 0 auto; font-size: 1.1rem; line-height: 1.8; }
    .content-body h1 { font-size: 2rem; margin: 2rem 0; }
    .content-body p { margin-bottom: 1.5rem; }
    .content-body a { color: var(--accent-color); }
    .content-iframe { width: 100%; height: 100vh; border: none; }

    /* Notes View Integration */
    .notes-col {
      grid-column: 2 / 4;
      background: var(--bg-primary);
      display: none;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      position: sticky;
      top: 0;
    }

    .body-view-notes .notes-col { display: flex; }
    .body-view-notes .article-list-col, .body-view-notes .content-col { display: none; }

    .notes-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 243, 237, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notes-content { padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
    .notes-waterfall { column-count: 2; column-gap: 20px; }
    @media (min-width: 1400px) { .notes-waterfall { column-count: 3; } }

    .note-card {
      break-inside: avoid;
      margin-bottom: 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .note-card .meta { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 10px; color: var(--text-muted); }
    .note-card .type { text-transform: uppercase; color: var(--accent-color); font-weight: 500; }
    .note-card .title { font-size: 0.95rem; font-weight: 500; margin-bottom: 8px; }
    .note-card .desc { font-size: 0.85rem; color: var(--text-secondary); white-space: pre-wrap; margin-bottom: 12px; }
    .note-card .actions { display: flex; gap: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); }

    /* Highlights & Toast */
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg-header); color: white; padding: 0.75rem 1.5rem; border-radius: 50px; font-size: 0.9rem; z-index: 10000; opacity: 0; transition: all 0.4s; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    
    .highlight-pop { position: fixed; z-index: 9999; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 0.4rem 0.6rem; border-radius: 8px; font-size: 0.8rem; box-shadow: var(--shadow); cursor: pointer; }

    /* Note Editor */
    .note-editor-container { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); width: 95%; max-width: 600px; background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.15); display: none; z-index: 100; margin-top: 10px; }
    .note-editor-container.active { display: block; }
    .note-editor-textarea { width: 100%; min-height: 120px; border: 1px solid #eee; border-radius: 4px; padding: 0.75rem; font-family: var(--font-family); font-size: 1rem; outline: none; resize: vertical; }

    /* Activity Panel */
    .activity-panel { position: fixed; top: 72px; right: 18px; width: 320px; max-height: 80vh; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1100; display: none; flex-direction: column; }
    .activity-panel.show { display: flex; }
    .activity-panel-header { padding: 0.8rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .activity-panel-list { list-style: none; overflow-y: auto; flex: 1; }
    .activity-panel-item { padding: 0.8rem; border-bottom: 1px solid var(--border-color); font-size: 0.8rem; }

    /* Empty/Loading */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-align: center; padding: 2rem; }
    .spinner { border: 3px solid var(--bg-primary); border-top: 3px solid var(--accent-color); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="toast" class="toast"><span id="toastMsg"></span></div>

  <div class="container">
    <!-- Column 1: Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="nav-toggle">
          <button id="navReader" class="nav-toggle-btn active" onclick="switchToReaderView()">Reader</button>
          <button id="navNotes" class="nav-toggle-btn" onclick="switchToNotesView()">Notes</button>
        </div>
        <input type="text" class="feed-search" placeholder="Search feeds..." id="feedSearch" oninput="filterFeeds()">
      </div>
      <ul class="feed-list" id="feedList"></ul>
      <div class="sidebar-footer" id="feedStats">Loading feeds...</div>
    </aside>

    <!-- Column 2: Article List -->
    <section class="article-list-col" id="articleListCol">
      <div class="article-list-header">
        <div class="date-nav">
          <button class="date-nav-btn" onclick="changeDate(-1)">←</button>
          <span class="current-date" id="currentDate">Today</span>
          <button class="date-nav-btn" onclick="changeDate(1)">→</button>
        </div>
        <div class="subtitle" id="listSubtitle">0 articles</div>
      </div>
      <ul class="article-list" id="articleList"></ul>
    </section>

    <!-- Column 3: Content -->
    <section class="content-col" id="contentCol">
      <div class="empty-state">
        <h3>Select an Article</h3>
      </div>
    </section>

    <!-- Unified Notes View (Covers Col 2 & 3) -->
    <section class="notes-col" id="notesCol">
      <div class="notes-header">
        <h2 style="font-size:1.1rem; font-weight:500;">Notes Waterfall</h2>
        <div style="display:flex; gap:10px;">
          <button class="action-btn" onclick="copyWeekly()">Copy Weekly</button>
          <button class="action-btn" onclick="exportWeekly()">Export MD</button>
          <button class="action-btn" onclick="refreshNotes()">Refresh</button>
        </div>
      </div>
      <div class="notes-content">
        <div id="notesWaterfall" class="notes-waterfall"></div>
        <div id="notesLoading" style="text-align:center; padding:2rem; color:var(--text-muted);">Loading...</div>
        <div style="text-align:center;"><button id="notesMoreBtn" class="action-btn" style="display:none" onclick="loadMoreNotes()">Load More</button></div>
      </div>
    </section>
  </div>

  <aside class="activity-panel" id="activityPanel">
    <div class="activity-panel-header"><strong>Activity Log</strong><button class="action-btn" onclick="toggleActivityPanel(false)">×</button></div>
    <ul class="activity-panel-list" id="activityPanelList"></ul>
  </aside>

  <button id="highlightBtn" class="highlight-pop" style="display:none" onclick="clipHighlight()">Highlight</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script>
    let feeds = [];
    let articles = [];
    let currentFeed = 'all';
    let currentArticle = null;
    let currentArticles = [];
    let currentDate = new Date();
    let isDateFilterMode = true;

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // --- Reader Logic ---
    function setupNotesInfiniteScroll() {
      const col = document.getElementById('notesCol');
      col.addEventListener('scroll', () => {
        if (notesFinished || notesLoading || !document.body.classList.contains('body-view-notes')) return;
        if (col.scrollTop + col.clientHeight >= col.scrollHeight - 300) {
          loadMoreNotes();
        }
      });
    }

    async function init() {
      await loadFeeds();
      await loadArticlesByDate(new Date());
      setupHashRouter();
      setupHighlightPopover();
      setupNotesInfiniteScroll();

      if (document.body.classList.contains('body-view-notes')) {
        refreshNotes();
      }
    }

    async function loadFeeds() {
      try {
        const res = await fetch('/api/feeds');
        feeds = await res.json();
        renderFeedList();
      } catch (e) {}
    }

    function renderFeedList() {
      const list = document.getElementById('feedList');
      const search = document.getElementById('feedSearch').value.toLowerCase();
      const filtered = feeds.filter(f => f.name.toLowerCase().includes(search));
      
      list.innerHTML = `
        <li class="feed-item ${currentFeed === 'all' ? 'active' : ''}" onclick="selectFeed('all')">
          <span class="name">By Date</span>
        </li>
        ${filtered.map((f, i) => `
          <li class="feed-item ${currentFeed === i ? 'active' : ''}" onclick="selectFeed(${feeds.indexOf(f)})">
            <span class="name">${f.name}</span>
          </li>
        `).join('')}
      `;
      document.getElementById('feedStats').textContent = `${feeds.length} feeds`;
    }

    function filterFeeds() { renderFeedList(); }

    async function selectFeed(index) {
      currentFeed = index;
      switchToReaderView();
      if (index === 'all') {
        loadArticlesByDate(new Date());
      } else {
        const articleList = document.getElementById('articleList');
        articleList.innerHTML = '<div class="spinner"></div>';
        try {
          const res = await fetch(`/api/feed/${index}`);
          const parsed = await res.json();
          currentArticles = parsed.items;
          renderArticleList(currentArticles);
          document.getElementById('listSubtitle').textContent = `${currentArticles.length} articles`;
          document.getElementById('currentDate').textContent = feeds[index].name;
        } catch (e) {}
      }
      renderFeedList();
    }

    async function loadArticlesByDate(date) {
      currentDate = date;
      const articleList = document.getElementById('articleList');
      articleList.innerHTML = '<div class="spinner"></div>';
      updateDateDisplay();
      try {
        const res = await fetch(`/api/articles/by-date?date=${date.toISOString().split('T')[0]}`);
        currentArticles = await res.json();
        renderArticleList(currentArticles);
        document.getElementById('listSubtitle').textContent = `${currentArticles.length} articles`;
      } catch (e) {}
    }

    function updateDateDisplay() {
      const d = document.getElementById('currentDate');
      const today = new Date().toISOString().split('T')[0];
      const sel = currentDate.toISOString().split('T')[0];
      d.textContent = today === sel ? 'Today' : currentDate.toLocaleDateString();
    }

    function changeDate(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      loadArticlesByDate(currentDate);
    }

    function renderArticleList(items) {
      const list = document.getElementById('articleList');
      list.innerHTML = items.map((item, i) => `
        <li class="article-item ${item.isRead ? 'is-read' : ''}" onclick="selectArticle(${i}, this)">
          <div class="article-item-title">${item.title}</div>
          <div class="article-item-meta"><span>${item.feedName || ''}</span></div>
        </li>
      `).join('');
    }

    function selectArticle(index, el) {
      currentArticle = currentArticles[index];
      document.querySelectorAll('.article-item').forEach(li => li.classList.remove('active'));
      el.classList.add('active');
      renderArticleContent(currentArticle);
      if (!currentArticle.isRead) {
        currentArticle.isRead = true;
        el.classList.add('is-read');
        apiPost('/api/article/state', { articleId: currentArticle.id, isRead: true });
      }
    }

    function renderArticleContent(article) {
      const col = document.getElementById('contentCol');
      const hasFull = article.content || article['content:encoded'];
      const actionsHtml = `
        <div class="actionbar"><div class="actionbar-inner">
          <div class="actionbar-left">
            <button class="action-btn" onclick="toggleFavoriteCurrent()">⭐</button>
            <button class="action-btn" onclick="openNoteEditor()">📝</button>
          </div>
          <div class="actionbar-right"><button class="action-btn" onclick="toggleActivityPanel()">Log</button></div>
        </div>
        <div class="note-editor-container" id="noteEditor">
          <textarea class="note-editor-textarea" id="noteTextarea" placeholder="Write a note..."></textarea>
          <div style="margin-top:10px; display:flex; gap:10px; justify-content:flex-end;">
            <button class="action-btn" onclick="closeNoteEditor()">Cancel</button>
            <button class="action-btn" onclick="saveNote()">Save</button>
          </div>
        </div>
        </div>
      `;

      if (hasFull) {
        col.innerHTML = actionsHtml + `<div class="content-body"><div class="content-body-inner" id="contentBody">${sanitizeHtml(hasFull)}</div></div>`;
      } else {
        col.innerHTML = actionsHtml + `<iframe class="content-iframe" src="${article.link}"></iframe>`;
      }
    }

    // --- Notes Logic ---
    let notesOffset = 0, notesLimit = 30, notesFinished = false, notesLoading = false;

    function switchToNotesView() {
      document.body.classList.add('body-view-notes');
      document.getElementById('navReader').classList.remove('active');
      document.getElementById('navNotes').classList.add('active');
      
      // Clear before refresh to show immediate feedback
      document.getElementById('notesWaterfall').innerHTML = '';
      refreshNotes(); 
    }

    function switchToReaderView() {
      document.body.classList.remove('body-view-notes');
      document.getElementById('navReader').classList.add('active');
      document.getElementById('navNotes').classList.remove('active');
    }

    async function refreshNotes() {
      notesOffset = 0; notesFinished = false;
      document.getElementById('notesWaterfall').innerHTML = '';
      await loadMoreNotes();
    }

    async function loadMoreNotes() {
      if (notesFinished || notesLoading) return;
      notesLoading = true;
      document.getElementById('notesLoading').style.display = 'block';
      try {
        const res = await fetch(`/api/activity?limit=${notesLimit}&offset=${notesOffset}`);
        const data = await res.json();
        const items = data.items || [];
        const wf = document.getElementById('notesWaterfall');
        
        items.forEach(it => {
          const p = it.payload || {};
          
          // --- Filter Noise ---
          // 1. Skip system materialize logs
          if (it.type === 'materialize') return;
          // 2. Skip state changes that are NOT favorites (just marked read)
          if (it.type === 'state' && !p.isFavorite) return;
          
          const isHighlight = it.type === 'note' && p.title === 'Highlight';
          const isNote = it.type === 'note' && p.title !== 'Highlight';
          const isFav = it.type === 'state' && p.isFavorite;

          const displayType = isHighlight ? 'Highlight' : (isFav ? 'Favorite' : 'Note');
          const title = it.article?.title || p.title || 'Untitled';
          const link = it.article?.link || p.url || '';
          const time = new Date(it.createdAt).toLocaleString();
          const desc = summarizeActivity(it);
          
          const card = document.createElement('div');
          card.className = 'note-card';
          
          card.innerHTML = `
            <div class="meta"><span class="type">${displayType}</span><span>${new Date(it.createdAt).toLocaleDateString()}</span></div>
            <div class="title">${title}</div>
            <div class="desc">${desc}</div>
            <div class="actions">
              <button class="action-btn btn-reader" style="font-size:0.7rem">Reader</button>
              ${link ? `<a class="action-btn" style="font-size:0.7rem; text-decoration:none;" href="${link}" target="_blank">Source</a>` : ''}
              <button class="action-btn btn-copy" style="font-size:0.7rem">Copy MD</button>
            </div>
          `;
          
          card.querySelector('.btn-reader').onclick = () => openInReader(link);
          card.querySelector('.btn-copy').onclick = () => copyNoteMD(title, link, time, desc);
          
          wf.appendChild(card);
        });
        
        notesOffset += items.length;
        if (items.length < notesLimit) notesFinished = true;
      } catch (e) {
        console.error('Error loading notes:', e);
      } finally {
        notesLoading = false;
        document.getElementById('notesLoading').style.display = notesFinished ? 'none' : 'block';
        document.getElementById('notesMoreBtn').style.display = (notesFinished || notesOffset === 0) ? 'none' : 'block';
      }
    }

    function copyNoteMD(title, link, time, desc) {
      const md = `### ${title}\n- Time: ${time}\n${link ? `- Link: ${link}\n` : ''}\n${desc}`;
      navigator.clipboard.writeText(md).then(() => showToast('Copied MD'));
    }

    function openInReader(link) {
      if (!link) return;
      switchToReaderView();
      location.hash = 'open=' + encodeURIComponent(link);
    }

    // --- Utilities ---
    async function apiPost(url, body) {
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
    }

    function sanitizeHtml(html) {
      return DOMPurify.sanitize(html, { FORBID_TAGS: ['script', 'iframe'], FORBID_ATTR: ['onerror', 'onclick'] });
    }

    function summarizeActivity(it) {
      const p = it.payload || {};
      if (it.type === 'state') {
        return p.isFavorite ? 'Added to favorites' : '';
      }
      if (it.type === 'note') {
        return p.content || p.title || 'Note saved';
      }
      return '';
    }


    function openNoteEditor() { document.getElementById('noteEditor').classList.add('active'); }
    function closeNoteEditor() { document.getElementById('noteEditor').classList.remove('active'); document.getElementById('noteTextarea').value = ''; }

    async function saveNote() {
      if (!currentArticle) return;
      const content = document.getElementById('noteTextarea').value;
      try {
        const mat = await apiPost('/api/article/materialize', { url: currentArticle.link, title: currentArticle.title });
        await apiPost('/api/article/note', { articleId: mat.articleId, title: 'Note', content });
        showToast('Note saved');
        closeNoteEditor();
        notesOffset = 0; // Trigger refresh next time Notes view is opened
      } catch (e) { showToast('Error saving note'); }
    }

    async function toggleFavoriteCurrent() {
      if (!currentArticle) return;
      const mat = await apiPost('/api/article/materialize', { url: currentArticle.link, title: currentArticle.title });
      await apiPost('/api/article/state', { articleId: mat.articleId, isFavorite: true });
      showToast('Favorited');
    }

    function toggleActivityPanel(force) {
      const p = document.getElementById('activityPanel');
      const show = typeof force === 'boolean' ? force : p.style.display !== 'flex';
      p.style.display = show ? 'flex' : 'none';
      if (show) refreshActivityLog();
    }

    async function refreshActivityLog() {
      const res = await fetch('/api/activity?limit=20').then(r => r.json());
      const list = document.getElementById('activityPanelList');
      list.innerHTML = '';
      (res.items || []).forEach(it => {
        const title = it.article?.title || it.payload?.title || 'Activity';
        const desc = summarizeActivity(it);
        const li = document.createElement('li');
        li.className = 'activity-panel-item';
        li.innerHTML = `<b>${it.type.toUpperCase()}</b>: ${title}<br/><small style="color:var(--text-muted)"></small>`;
        li.querySelector('small').textContent = desc;
        list.appendChild(li);
      });
    }

    function setupHighlightPopover() {
      const btn = document.getElementById('highlightBtn');
      document.addEventListener('mouseup', () => {
        const s = window.getSelection();
        const text = s.toString().trim();
        const content = document.getElementById('contentBody');
        if (text && text.length > 3 && content && content.contains(s.anchorNode)) {
          const range = s.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          btn.style.left = (rect.left + rect.width / 2 - btn.offsetWidth / 2) + 'px';
          btn.style.top = (rect.top + window.scrollY - 45) + 'px';
          btn.style.position = 'absolute';
          btn.style.display = 'block';
        } else {
          btn.style.display = 'none';
        }
      });
    }

    async function clipHighlight() {
      const s = window.getSelection().toString();
      if (!currentArticle || !s) return;
      const mat = await apiPost('/api/article/materialize', { url: currentArticle.link, title: currentArticle.title });
      await apiPost('/api/article/note', { articleId: mat.articleId, title: 'Highlight', content: `> ${s}` });
      showToast('Highlight saved');
      document.getElementById('highlightBtn').style.display = 'none';
      notesOffset = 0; // Trigger refresh next time Notes view is opened
    }

    function setupHashRouter() {
      const handle = async () => {
        const h = location.hash;
        if (h.startsWith('#open=')) {
          const link = decodeURIComponent(h.split('=')[1]);
          const res = await fetch('/api/articles?limit=100').then(r => r.json());
          const found = res.find(a => a.link === link);
          if (found) { currentArticles = [found]; renderArticleList([found]); selectArticle(0, document.querySelector('.article-item')); }
        }
      };
      window.addEventListener('hashchange', handle);
      handle();
    }

    async function copyWeekly() {
      const md = await fetch('/api/export/markdown?days=7').then(r => r.text());
      navigator.clipboard.writeText(md).then(() => showToast('Copied Weekly'));
    }

    function exportWeekly() { window.open('/api/export/markdown?days=7', '_blank'); }

    init();
  </script>
</body>

</html>
